# NoBlooks — wallpaper-reactive home launcher
# Tuned for constrained devices (Termux/low-RAM CI runners): one worker, modest heaps.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=1

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# Keep the Kotlin compiler daemon small; it runs alongside the Gradle daemon.
kotlin.daemon.jvmargs=-Xmx768m
kotlin.incremental=true
